# 1. 核心问题定位 (Diagnostic)
# 通过 kubectl describe 和 nvidia-container-cli 发现，硬件层（nvgpu 模块）正常，但 Kubernetes 插件失败，原因有二：

# 平台识别失效：插件因找不到 /sys/devices/soc0/family 文件，无法确认这是 Tegra (Jetson) 平台，导致不加载驱动逻辑。

# 标识符缺失：Jetson 驱动不提供 GPU UUID（返回 null），而插件默认按 UUID 上报，导致资源匹配为空。

# 2. 环境预处理 (Host Preparation)
# 由于插件代码写死了读取路径，我们在宿主机上手工构造了一套“虚假”的内核设备树结构，用于诱导插件进入 Tegra 兼容模式：

# 创建伪造目录：sudo mkdir -p /etc/kubernetes/fake_sys/devices/soc0

# 写入平台标识：echo "tegra" | sudo tee /etc/kubernetes/fake_sys/devices/soc0/family

# 3. 插件配置优化 (Plugin Patching)
# 我们通过修改 nvidia-device-plugin 的 DaemonSet YAML 实现了资源上报。

# A. 策略调整 (Strategy)
# DEVICE_ID_STRATEGY: "index"：强制插件放弃寻找 UUID，改为使用数字索引（如 GPU 0）上报资源。

# FAIL_ON_INIT_ERROR: "false"：允许插件在找不到 libnvidia-ml.so（Jetson 不含此库）时继续运行。

# B. 伪造挂载 (Fake Mount)
# 路径上移：不直接挂载 family 文件，而是挂载整个 /sys/devices 目录。

# 原理：容器启动时，用宿主机准备好的 fake_sys/devices 覆盖容器内的 /sys/devices。由于 devices 是 /sys 下已有的目录，避开了在只读文件系统下创建新子目录的权限错误。

# C. 权限与限制 (Scope)
# privileged: true：赋予容器访问 /dev 硬件接口和执行 Bind Mount 的最高权限。

# nodeSelector：锁定 kubernetes.io/hostname: jetson，防止该专用配置干扰集群内其他 x86 或非 GPU 节点。

# 4. 最终验证 (Validation)
# 日志确认：插件输出 Detected Tegra platform 和 Registered device: 0。

# 资源上报：kubectl describe node jetson 的 Allocatable 列表中成功出现 nvidia.com/gpu: 1。
# 
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: nvidia-device-plugin-daemonset
  namespace: kube-system
spec:
  selector:
    matchLabels:
      name: nvidia-device-plugin-ds
  updateStrategy:
    type: RollingUpdate
  template:
    metadata:
      labels:
        name: nvidia-device-plugin-ds
    spec:
      nodeSelector:
          kubernetes.io/hostname: jetson
      hostNetwork: true
      tolerations:
      - key: nvidia.com/gpu
        operator: Exists
        effect: NoSchedule
      # Mark this pod as a critical add-on; when enabled, the critical add-on
      # scheduler reserves resources for critical add-on pods so that they can
      # be rescheduled after a failure.
      # See https://kubernetes.io/docs/tasks/administer-cluster/guaranteed-scheduling-critical-addon-pods/
      priorityClassName: "system-node-critical"
      containers:
      - image: 192.168.137.97:8086/hthx/k8s-device-plugin:v0.14.5-arm64
        name: nvidia-device-plugin-ctr
        securityContext:
          privileged: true
        env:
          - name: DEVICE_ID_STRATEGY
            value: "index"
          - name: FAIL_ON_INIT_ERROR
            value: "false"
          - name: NVIDIA_VISIBLE_DEVICES
            value: "all"
          - name: NVIDIA_DRIVER_CAPABILITIES
            value: "all"
        volumeMounts:
        - name: device-plugin
          mountPath: /var/lib/kubelet/device-plugins
        # 修改点：挂载到 devices 这一层
        - name: fake-sys-devices
          mountPath: /sys/devices
      volumes:
      - name: device-plugin
        hostPath:
          path: /var/lib/kubelet/device-plugins
      # 修改点：对应宿主机包含 devices 子目录的路径
      - name: fake-sys-devices
        hostPath:
          path: /etc/kubernetes/fake_sys/devices
          type: Directory