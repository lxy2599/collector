# 1. 权限配置 (RBAC)
apiVersion: v1
kind: ServiceAccount
metadata:
  name: fluent-bit
  namespace: monitoring
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: fluent-bit-read
rules:
- apiGroups: [""]
  resources: ["pods", "namespaces"]
  verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: fluent-bit-read
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: fluent-bit-read
subjects:
- kind: ServiceAccount
  name: fluent-bit
  namespace: monitoring
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: loki-config
  namespace: monitoring
data:
  loki.yaml: |
    auth_enabled: false
    server:
      http_listen_port: 3100

    common:
      path_prefix: /loki
      storage:
        filesystem:
          chunks_directory: /loki/chunks
          rules_directory: /loki/rules
      replication_factor: 1
      ring:
        kvstore:
          store: inmemory

    # --- 修正点 1：统一 Ingester 和 Block Builder 的窗口 ---
    ingester:
      max_chunk_age: 336h

    block_builder:
      max_chunk_age: 336h

    schema_config:
      configs:
        - from: "2020-10-24"
          store: tsdb
          object_store: filesystem
          schema: v13
          index:
            prefix: index_
            period: 1d

    # --- 修正点 2：统一 Limits 和 Table Manager 的保留期 ---
    limits_config:
      retention_period: 168h
      unordered_writes: true
      reject_old_samples: true
      reject_old_samples_max_age: 168h

    table_manager:
      retention_deletes_enabled: true
      retention_period: 168h

    compactor:
      working_directory: /loki/retention
      compaction_interval: 10m
      retention_enabled: true
      retention_delete_delay: 2h
      delete_request_store: filesystem
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: loki
  namespace: monitoring
  labels:
    app: loki
spec:
  replicas: 1
  selector:
    matchLabels:
      app: loki
  template:
    metadata:
      labels:
        app: loki
    spec:
      securityContext:
        fsGroup: 10001
        runAsGroup: 10001
        runAsUser: 10001
      hostNetwork: true
      nodeSelector:
        node-role.kubernetes.io/control-plane: ""
      tolerations:
      - key: "node-role.kubernetes.io/control-plane"
        operator: "Exists"
        effect: "NoSchedule"
      - key: "node-role.kubernetes.io/master"
        operator: "Exists"
        effect: "NoSchedule"
      containers:
      - name: loki
        image: 192.168.137.97:8086/hthx/loki:3.5.12-arm64
        args:
          - "-config.file=/etc/loki/loki.yaml"
        ports:
        - containerPort: 3100
          name: http-metrics
        readinessProbe:
          httpGet:
            path: /ready
            port: 3100
          initialDelaySeconds: 5
        volumeMounts:
        - name: config
          mountPath: /etc/loki
        - name: storage
          mountPath: /loki
      volumes:
      - name: config
        configMap:
          name: loki-config
      - name: storage
        hostPath:
          path: /var/lib/loki
          type: DirectoryOrCreate
---
apiVersion: v1
kind: Service
metadata:
  name: loki-service
  namespace: monitoring
spec:
  selector:
    app: loki
  ports:
    - protocol: TCP
      port: 3100
      targetPort: 3100
---
# 3. Fluent Bit 配置中心
apiVersion: v1
kind: ConfigMap
metadata:
  name: fluent-bit-config
  namespace: monitoring
data:
  fluent-bit.conf: |
    [SERVICE]
        Flush         5
        Daemon        Off
        Log_Level     info
        Parsers_File  parsers.conf
        storage.type  filesystem
        storage.path  /var/log/fluent-bit/storage/
        storage.backlog.mem_limit 50M


    [INPUT]
        Name                tail
        Tag                 kube.*
        Path                /var/log/containers/*.log
        multiline.parser    docker, cri, java 
        DB                  /var/log/fluent-bit/flb_kube.db
        Mem_Buf_Limit       100MB
        Skip_Long_Lines     On

    # 1. 首先获取 K8s 元数据，否则拿不到 pod_name
    [FILTER]
        Name                kubernetes
        Match               kube.*
        Kube_URL            https://192.168.137.97:6443
        tls.verify          Off
        Merge_Log           On
        Keep_Log            Off

    [FILTER]
        Name                rewrite_tag
        Match               kube.*
        # 匹配任何包含 deployment 字符串的 pod 名
        Rule                $kubernetes['pod_name']  deployment  deploy_logs  true

    # -----------------------------------------------------------
    # 链路 A：处理普通日志 (剩下的 kube.*)，依然只保留 ERROR
    # -----------------------------------------------------------
    [FILTER]
        Name                grep
        Match               kube.*
        Regex               log (?i)error

    # -----------------------------------------------------------
    # 链路 B：处理带 deployment 的日志 (deploy_logs)，不做 error 过滤
    # -----------------------------------------------------------
    # 这里不需要 grep，所以它会保留所有级别的日志

    # 为所有日志添加节点信息
    [FILTER]
        Name                record_modifier
        Match               *
        Record              node_name ${NODE_NAME}

    # -----------------------------------------------------------
    # 输出配置
    # -----------------------------------------------------------

    # 输出 A：普通 Error 日志
    [OUTPUT]
        Name                loki
        Match               kube.*
        Host                192.168.137.97
        Port                3100
        Labels              job=fluent-bit, node_instance=${NODE_NAME}
        auto_kubernetes_labels on

    # 输出 B：Deployment 专项日志
    [OUTPUT]
        Name                loki
        Match               deploy_logs
        Host                192.168.137.97
        Port                3100
        # 移除 auto_kubernetes_labels 看看手动标签是否生效
        Labels              job=inference, node_instance=${NODE_NAME}
        # 如果非要开启，确保标签不冲突
        auto_kubernetes_labels on

  parsers.conf: |
    [PARSER]
        Name        docker
        Format      json
        Time_Key    time
        Time_Format %Y-%m-%dT%H:%M:%S.%L
    [PARSER]
        Name        cri
        Format      regex
        Regex       ^(?<time>[^ ]+) (?<stream>stdout|stderr) (?<logtag>[^ ]*) (?<log>.*)$
        Time_Key    time
        Time_Format %Y-%m-%dT%H:%M:%S.%L%z

---
# 4. Fluent Bit DaemonSet (所有节点运行)
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: fluent-bit
  namespace: monitoring
spec:
  selector:
    matchLabels:
      k8s-app: fluent-bit-logging
  template:
    metadata:
      labels:
        k8s-app: fluent-bit-logging
    spec:
      serviceAccountName: fluent-bit
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      tolerations:
      - operator: Exists # 确保在所有节点部署
      containers:
      - name: fluent-bit
        image: 192.168.137.97:8086/hthx/fluent-bit:3.0.0-arm64
        env:
        - name: NODE_NAME
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName
        resources:
          limits:
            memory: 250Mi
          requests:
            cpu: 100m
            memory: 100Mi
        volumeMounts:
        - name: varlog
          mountPath: /var/log
        - name: varlibdockercontainers
          mountPath: /var/lib/docker/containers
          readOnly: true
        - name: fluent-bit-config
          mountPath: /fluent-bit/etc/
        - name: storage-path
          mountPath: /var/log/fluent-bit/storage/
      volumes:
      - name: varlog
        hostPath:
          path: /var/log
      - name: varlibdockercontainers
        hostPath:
          path: /var/lib/docker/containers
      - name: fluent-bit-config
        configMap:
          name: fluent-bit-config
      - name: storage-path
        hostPath:
          path: /var/log/fluent-bit/storage/
          type: DirectoryOrCreate