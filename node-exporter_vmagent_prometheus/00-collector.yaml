apiVersion: v1
kind: ConfigMap
metadata:
  name: vmagent-config
  namespace: monitoring
data:
  prometheus.yml: |
    global:
      scrape_interval: 10s
    scrape_configs:
      - job_name: 'edge-node-metrics'
        honor_labels: true
        static_configs:
          - targets: ['localhost:9101'] # 抓取同 Pod 内的 Node Exporter
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: edge-metrics-bundle
  namespace: monitoring
data:
  nodes.conf: |
    bupt-a=space_server:10s
    k8s-worker1=raspberry_pi:10s
    k8s-master=default:10s
    jetson=jetson:10s

  jetson.sh: |
    #!/bin/bash
    # GPU利用率%
    if [ -f /sys/devices/gpu.0/load ]; then
      GPU_LOAD=$(cat /sys/devices/gpu.0/load)
      echo "gpu_utilization=$(echo "scale=2; $GPU_LOAD / 10" | bc)"
    fi
    # 温度摄氏度
    if [ -f /sys/class/thermal/thermal_zone2/temp ]; then
      TEMP_RAW=$(cat /sys/class/thermal/thermal_zone2/temp)
      echo "temperature=$(echo "scale=2; $TEMP_RAW / 1000" | bc)"
    fi
    # 显存利用率
    MEM_TOTAL=$(grep MemTotal /proc/meminfo | awk '{print $2}')
    MEM_AVAIL=$(grep MemAvailable /proc/meminfo | awk '{print $2}')
    if [ -n "$MEM_TOTAL" ] && [ -n "$MEM_AVAIL" ]; then
      MEM_USED=$((MEM_TOTAL - MEM_AVAIL))
      echo "mem_utilization=$(echo "scale=2; $MEM_USED * 100 / $MEM_TOTAL" | bc)"
    fi
    # 电压
    VOLT_PATH="/sys/bus/i2c/drivers/ina3221x/0-0040/iio:device0/in_voltage0_input"
    if [ -f "$VOLT_PATH" ]; then
      VOLT_RAW=$(cat "$VOLT_PATH")
      echo "voltage=$(echo "scale=2; $VOLT_RAW / 1000" | bc)"
    fi
  raspberry_pi.sh: |
    #!/bin/bash
    TEMP=$(vcgencmd measure_temp | tr -d "temp=" | tr -d "'C")
    if [ -n "$TEMP" ]; then
      echo "temperature=$TEMP"
    fi

    VOLT=$(vcgencmd measure_volts core | tr -d "volt=" | tr -d "V")
    if [ -n "$VOLT" ]; then
      echo "voltage=$VOLT"
    fi

  space_server.sh: |
    #!/bin/bash
    # 增加 -f 强制读取，防止设备 busy，增加 2>/dev/null 防止报错污染输出
    
    temp_sum=0
    temp_count=0

    for addr in $(seq 0x48 0x4F); do
        hex_addr=$(printf "%02X" $addr)
        # 核心修改：使用 -f 
        input_data=$(i2cget -f -y 0 0x$hex_addr 0x00 w 2>/dev/null)
        
        if [ ! -z "$input_data" ]; then
            decimal_data=$((input_data))
            low_byte=$(( (decimal_data & 0xFF00) >> 8 ))
            high_byte=$(( (decimal_data & 0x00FF) << 8 ))
            little_endian=$(( low_byte | high_byte ))
            shifted_data=$(( little_endian >> 4 ))
            current_temp=$(echo "scale=4; $shifted_data * 0.0625" | bc)
            temp_sum=$(echo "$temp_sum + $current_temp" | bc)
            temp_count=$((temp_count + 1))
        fi
    done

    if [ $temp_count -gt 0 ]; then
        avg_temp=$(echo "scale=4; $temp_sum / $temp_count" | bc)
        echo "temperature=${avg_temp}"
    fi

    # 电压监控增加 -f
    total_voltage_raw=$(i2cget -f -y 1 0x40 0x02 w 2>/dev/null)
    if [ ! -z "$total_voltage_raw" ]; then
        total_voltage_hex_le=$(echo $total_voltage_raw | awk '{print toupper(substr($1,5,2) substr($1,3,2))}')
        total_voltage=$(echo "ibase=16; $total_voltage_hex_le" | bc)
        total_voltage=$(echo "scale=4; $total_voltage * 1.25 / 1000" | bc)
        echo "voltage=${total_voltage}"
    fi
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: node-exporter-arm64
  namespace: monitoring
  labels:
    app: node-exporter
spec:
  selector:
    matchLabels:
      app: node-exporter
  template:
    metadata:
      labels:
        app: node-exporter
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: kubernetes.io/arch
                operator: In
                values:
                - arm64
                - amd64
      
      # 【关键 2】使用 Host 网络，确保能监控宿主机网络
      hostNetwork: true
      hostPID: true
      
      containers:
      # --- 容器 A: Node Exporter ---
      - name: node-exporter
        image: 192.168.137.97:8086/hthx/node-exporter:v1.10.2-arm64
        args:
          - "--path.rootfs=/host"
          - "--collector.textfile.directory=/var/lib/node_exporter_textfile"
          - "--web.listen-address=0.0.0.0:9101"
          - "--path.procfs=/host/proc"
          - "--path.sysfs=/host/sys"
        ports:
          - name: metrics
            containerPort: 9101
        volumeMounts:
          - name: rootfs
            mountPath: /host
            readOnly: true
          - name: shared-dir
            mountPath: /var/lib/node_exporter_textfile
            readOnly: false
          - name: proc
            mountPath: /host/proc
            readOnly: true
          - name: sys
            mountPath: /host/sys
            readOnly: true
          - name: timezone
            mountPath: /etc/localtime
            readOnly: true
          - name: udev
            mountPath: /run/udev
            readOnly: true

      # --- 容器 B: Sidecar ---
      - name: metric-sidecar
        image: 192.168.137.97:8086/hthx/edge-collector-go:v1.1-arm64
        securityContext:
          privileged: true
        env:
          - name: NODE_NAME
            valueFrom:
              fieldRef:
                fieldPath: spec.nodeName # 注入真实的节点主机名
        volumeMounts:
          - name: scripts-vol
            mountPath: /scripts
          - name: shared-dir
            mountPath: /var/lib/node_exporter_textfile
          - name: dev-dir
            mountPath: /dev
          - name: timezone
            mountPath: /etc/localtime
            readOnly: true
          # 树莓派挂载
          - name: vchiq-dev
            mountPath: /dev/vchiq
          # TX2挂在
          - name: sys
            mountPath: /sys
      # --- 容器 C: vmagent (新增缓存推送容器) ---
      - name: vmagent
        image: 192.168.137.97:8086/hthx/vmagent:v1.135.0-arm64
        args:
          - "-promscrape.config=/etc/vmagent/prometheus.yml"
          - "-remoteWrite.url=http://192.168.137.97:9090/api/v1/write"
          - "-remoteWrite.tmpDataPath=/vmagent-cache" # 缓存目录
          - "-remoteWrite.label=node_name=$(NODE_NAME)"
          - "-remoteWrite.forcePromProto"
          - "-enableTCP6"
        env:
          - name: NODE_NAME
            valueFrom:
              fieldRef:
                fieldPath: spec.nodeName
        volumeMounts:
          - name: vmagent-config-vol
            mountPath: /etc/vmagent
          - name: vmagent-cache-vol
            mountPath: /vmagent-cache
          - name: timezone
            mountPath: /etc/localtime
            readOnly: true

      volumes:
        - name: vchiq-dev
          hostPath:
            path: /dev/vchiq
        - name: rootfs
          hostPath: {path: /}
        - name: shared-dir
          emptyDir: {}
        - name: scripts-vol
          configMap:
            name: edge-metrics-bundle
            defaultMode: 0755
        - name: dev-dir      # 【必须】定义宿主机设备卷
          hostPath:
            path: /dev
        - name: vmagent-config-vol
          configMap:
            name: vmagent-config
        - name: vmagent-cache-vol
          hostPath:
            path: /var/lib/vmagent-cache # 关键：持久化在宿主机，重启不丢数据
            type: DirectoryOrCreate
        - name: proc
          hostPath: {path: /proc}
        - name: sys
          hostPath: {path: /sys}
        - name: timezone
          hostPath:
            path: /etc/localtime # 直接透传宿主机的时区配置
        - name: udev
          hostPath:
            path: /run/udev
            type: Directory # 确保宿主机该目录已存在
---
apiVersion: v1
kind: Service
metadata:
  name: node-export
  namespace: monitoring
  labels:
    app: node-exporter
spec:
  clusterIP: None
  selector:
    app: node-exporter
  ports:
    - name: metrics
      port: 9101        # 外部访问端口
      targetPort: 9101  # 对应 Pod 里的新端口